[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "astro-agent"
version = "0.2.0"
description = "A verifiable LLM agent for hierarchical molecular-cloud catalog analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pandas>=2.2,<3",
  "numpy>=2.0,<3",
  "scipy>=1.13,<2",
  "odrpack>=0.6.1,<0.7",
  "matplotlib>=3.9,<4",
  "openai>=1.68,<3",
  "pydantic-settings>=2.5,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "build>=1.2,<2",
  "twine>=6,<7",
  "commitizen>=4,<5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "pep621"
update_changelog_on_bump = true
major_version_zero = true
